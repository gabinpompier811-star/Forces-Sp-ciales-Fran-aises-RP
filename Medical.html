<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Médical & Santé - FSF</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Firebase JS SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        body { 
            background-color: #070a12; 
            font-family: system-ui, -apple-system, sans-serif;
        }
        .custom-card { 
            background: linear-gradient(145deg, #0f172a 0%, #0b1120 100%);
            border: 1px solid #1e293b;
        }
        .custom-card:hover {
            border-color: #334155;
            box-shadow: 0 10px 25px -5px rgba(244, 63, 94, 0.05);
        }
        /* Modal Animation */
        .modal-backdrop {
            background-color: rgba(3, 7, 18, 0.85);
            backdrop-filter: blur(8px);
        }
    </style>
</head>
<body class="text-slate-100 min-h-screen flex flex-col p-4 md:p-8 max-w-7xl mx-auto space-y-6">

    <!-- HEADER BAR -->
    <header class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 bg-slate-900/60 p-4 rounded-2xl border border-slate-800 backdrop-blur-md">
        <div class="flex items-center gap-4">
            <a href="index.html" class="px-3.5 py-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-xl text-xs font-bold text-slate-200 flex items-center gap-2 transition-all hover:scale-105">
                <i class="fa-solid fa-arrow-left"></i> Retour
            </a>
            <div>
                <h1 class="text-xl font-black text-rose-500 tracking-wide flex items-center gap-2">
                    <i class="fa-solid fa-heart-pulse animate-pulse"></i> Service Médical &amp; Santé
                </h1>
                <p class="text-xs text-slate-400">Gestion tactique du personnel et fiches d'aptitude</p>
            </div>
        </div>

        <button onclick="openModal()" class="w-full md:w-auto px-5 py-2.5 bg-gradient-to-r from-rose-600 to-rose-700 hover:from-rose-500 hover:to-rose-600 text-white font-bold text-xs rounded-xl shadow-lg shadow-rose-950/50 flex items-center justify-center gap-2 transition-all transform hover:-translate-y-0.5">
            <i class="fa-solid fa-user-plus"></i> Nouvelle Fiche Médicale
        </button>
    </header>

    <!-- DASHBOARD STATS -->
    <section class="grid grid-cols-2 md:grid-cols-4 gap-4">
        <div class="bg-slate-900/40 border border-slate-800/80 p-4 rounded-xl flex items-center gap-3">
            <div class="p-3 bg-rose-500/10 text-rose-400 rounded-lg text-lg"><i class="fa-solid fa-users"></i></div>
            <div>
                <span class="text-[10px] uppercase font-bold text-slate-400 tracking-wider">Total Effectif</span>
                <p id="stat-total" class="text-lg font-black text-white">0</p>
            </div>
        </div>
        <div class="bg-slate-900/40 border border-slate-800/80 p-4 rounded-xl flex items-center gap-3">
            <div class="p-3 bg-emerald-500/10 text-emerald-400 rounded-lg text-lg"><i class="fa-solid fa-plane-departure"></i></div>
            <div>
                <span class="text-[10px] uppercase font-bold text-slate-400 tracking-wider">Aptes TAP</span>
                <p id="stat-tap" class="text-lg font-black text-emerald-400">0%</p>
            </div>
        </div>
        <div class="bg-slate-900/40 border border-slate-800/80 p-4 rounded-xl flex items-center gap-3">
            <div class="p-3 bg-blue-500/10 text-blue-400 rounded-lg text-lg"><i class="fa-solid fa-person-running"></i></div>
            <div>
                <span class="text-[10px] uppercase font-bold text-slate-400 tracking-wider">VMA Moyenne</span>
                <p id="stat-vma" class="text-lg font-black text-blue-400">0 km/h</p>
            </div>
        </div>
        <div class="bg-slate-900/40 border border-slate-800/80 p-4 rounded-xl flex items-center gap-3">
            <div class="p-3 bg-amber-500/10 text-amber-400 rounded-lg text-lg"><i class="fa-solid fa-shield-halved"></i></div>
            <div>
                <span class="text-[10px] uppercase font-bold text-slate-400 tracking-wider">Inaptes / Restreints</span>
                <p id="stat-inapte" class="text-lg font-black text-amber-400">0</p>
            </div>
        </div>
    </section>

    <!-- SEARCH & FILTERS -->
    <div class="flex flex-col sm:flex-row gap-3">
        <div class="relative flex-1">
            <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-slate-500 text-xs"></i>
            <input type="text" id="searchInput" oninput="renderCards()" placeholder="Rechercher par nom, matricule ou groupe sanguin..." 
                   class="w-full bg-slate-900/80 border border-slate-800 rounded-xl pl-9 pr-4 py-2 text-xs text-slate-200 focus:outline-none focus:border-rose-500 transition-colors">
        </div>
        <select id="filterTap" onchange="renderCards()" class="bg-slate-900/80 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-300 focus:outline-none focus:border-rose-500">
            <option value="ALL">Toutes les aptitudes TAP</option>
            <option value="APTE">TAP : Apte uniquement</option>
            <option value="INAPTE">TAP : Inapte uniquement</option>
        </select>
    </div>

    <!-- CARDS CONTAINER -->
    <main id="medical-cards-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        <!-- Rendered dynamically -->
    </main>

    <!-- MODAL (AJOUT / ÉDITION) -->
    <div id="medicalModal" class="fixed inset-0 z-50 hidden modal-backdrop flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-lg p-6 shadow-2xl relative space-y-4">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 id="modalTitle" class="text-base font-bold text-rose-400 flex items-center gap-2">
                    <i class="fa-solid fa-file-medical"></i> Nouvelle Fiche Médicale
                </h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white transition-colors">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <form id="medicalForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
                <input type="hidden" id="recordKey">
                
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[11px] font-bold text-slate-400 mb-1">Nom & Prénom *</label>
                        <input type="text" id="formName" required class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-xs text-white focus:outline-none focus:border-rose-500">
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-slate-400 mb-1">Matricule *</label>
                        <input type="text" id="formMat" required class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-xs font-mono text-blue-400 focus:outline-none focus:border-rose-500">
                    </div>
                </div>

                <div class="grid grid-cols-3 gap-3">
                    <div>
                        <label class="block text-[11px] font-bold text-slate-400 mb-1">Groupe Sanguin</label>
                        <select id="formSang" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-xs text-white focus:outline-none focus:border-rose-500">
                            <option value="A+">A+</option><option value="A-">A-</option>
                            <option value="B+">B+</option><option value="B-">B-</option>
                            <option value="AB+">AB+</option><option value="AB-">AB-</option>
                            <option value="O+">O+</option><option value="O-">O-</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-slate-400 mb-1">VMA (km/h)</label>
                        <input type="number" step="0.5" id="formVma" value="16" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-xs text-white focus:outline-none focus:border-rose-500">
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-slate-400 mb-1">Aptitude TAP</label>
                        <select id="formTap" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-xs text-white focus:outline-none focus:border-rose-500">
                            <option value="true">Apte</option>
                            <option value="false">Inapte</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-[11px] font-bold text-slate-400 mb-1">Observations / Antécédents</label>
                    <textarea id="formNotes" rows="2" placeholder="Allergies, blessures récentes, restrictions..." class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-xs text-white focus:outline-none focus:border-rose-500 resize-none"></textarea>
                </div>

                <div class="flex justify-end gap-2 pt-3 border-t border-slate-800">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl text-xs font-bold transition-colors">Annuler</button>
                    <button type="submit" class="px-5 py-2 bg-rose-600 hover:bg-rose-500 text-white rounded-xl text-xs font-bold transition-colors shadow-lg shadow-rose-950">Enregistrer</button>
                </div>
            </form>
        </div>
    </div>

    <!-- JAVASCRIPT -->
    <script>
        // Check Session Permissions
        const currentUser = JSON.parse(localStorage.getItem('fsf_user_session'));
        if (!currentUser || (!currentUser.isOwner && !(currentUser.perms || []).includes('MEDICAL'))) {
            alert("Accès non autorisé au Service Médical !");
            window.location.href = "index.html";
        }

        // Firebase Initialization
        const firebaseConfig = { databaseURL: "https://fsf-rp-default-rtdb.europe-west1.firebasedatabase.app" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let rawMedicalData = {};

        // Listen for Realtime DB updates
        db.ref('medical').on('value', snapshot => {
            rawMedicalData = snapshot.val() || {};
            updateDashboardStats();
            renderCards();
        });

        // Safe HTML Sanitization (Anti-XSS)
        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // Dashboard Stats Calculation
        function updateDashboardStats() {
            const keys = Object.keys(rawMedicalData);
            const total = keys.length;

            if (total === 0) {
                document.getElementById('stat-total').innerText = '0';
                document.getElementById('stat-tap').innerText = '0%';
                document.getElementById('stat-vma').innerText = '0 km/h';
                document.getElementById('stat-inapte').innerText = '0';
                return;
            }

            let tapCount = 0;
            let totalVma = 0;

            keys.forEach(k => {
                const item = rawMedicalData[k];
                if (item.tap) tapCount++;
                const vmaVal = parseFloat(item.vma) || 0;
                totalVma += vmaVal;
            });

            document.getElementById('stat-total').innerText = total;
            document.getElementById('stat-tap').innerText = Math.round((tapCount / total) * 100) + '%';
            document.getElementById('stat-vma').innerText = (totalVma / total).toFixed(1) + ' km/h';
            document.getElementById('stat-inapte').innerText = (total - tapCount);
        }

        // Render List & Apply Filters
        function renderCards() {
            const container = document.getElementById('medical-cards-container');
            const search = document.getElementById('searchInput').value.toLowerCase();
            const tapFilter = document.getElementById('filterTap').value;

            const keys = Object.keys(rawMedicalData).filter(key => {
                const m = rawMedicalData[key];
                const matchSearch = (m.name || '').toLowerCase().includes(search) || 
                                    (m.mat || '').toLowerCase().includes(search) ||
                                    (m.sang || '').toLowerCase().includes(search);
                
                const matchTap = tapFilter === 'ALL' || 
                                 (tapFilter === 'APTE' && m.tap) || 
                                 (tapFilter === 'INAPTE' && !m.tap);

                return matchSearch && matchTap;
            });

            if (keys.length === 0) {
                container.innerHTML = `
                    <div class="col-span-1 md:col-span-2 lg:col-span-3 text-center py-12 border border-dashed border-slate-800 rounded-2xl bg-slate-900/20">
                        <i class="fa-solid fa-folder-open text-3xl text-slate-600 mb-2"></i>
                        <p class="text-xs text-slate-400 font-medium">Aucun dossier médical ne correspond à vos critères.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = keys.map(key => {
                const m = rawMedicalData[key];
                const isTap = !!m.tap;

                return `
                    <div class="custom-card p-5 rounded-2xl space-y-4 shadow-xl flex flex-col justify-between transition-all">
                        <div class="space-y-3">
                            <!-- Header Card -->
                            <div class="flex justify-between items-start border-b border-slate-800/80 pb-3">
                                <div>
                                    <h3 class="font-black text-white text-sm tracking-wide">${escapeHtml(m.name)}</h3>
                                    <span class="text-[11px] text-blue-400 font-mono font-semibold">MATRICULE : ${escapeHtml(m.mat)}</span>
                                </div>
                                <span class="px-2.5 py-1 bg-rose-950/80 text-rose-300 border border-rose-800/60 rounded-lg text-[10px] font-black tracking-wider">
                                    <i class="fa-solid fa-droplet text-rose-500 mr-1"></i>${escapeHtml(m.sang || 'N/A')}
                                </span>
                            </div>

                            <!-- Metrics -->
                            <div class="grid grid-cols-2 gap-2 text-xs bg-slate-950/40 p-2.5 rounded-xl border border-slate-800/50">
                                <div class="flex flex-col">
                                    <span class="text-[10px] text-slate-500 font-bold uppercase">Aptitude TAP</span>
                                    <span class="${isTap ? 'text-emerald-400' : 'text-rose-400'} font-bold flex items-center gap-1 mt-0.5">
                                        <i class="fa-solid ${isTap ? 'fa-circle-check' : 'fa-circle-xmark'}"></i> ${isTap ? 'Apte' : 'Inapte'}
                                    </span>
                                </div>
                                <div class="flex flex-col">
                                    <span class="text-[10px] text-slate-500 font-bold uppercase">Statut VMA</span>
                                    <span class="font-mono text-blue-400 font-bold mt-0.5">${escapeHtml(m.vma || 'N/A')} km/h</span>
                                </div>
                            </div>

                            <!-- Notes Section -->
                            ${m.notes ? `
                                <div class="text-[11px] text-slate-400 bg-slate-900/60 p-2 rounded-lg border border-slate-800 italic">
                                    "${escapeHtml(m.notes)}"
                                </div>
                            ` : ''}
                        </div>

                        <!-- Card Footer -->
                        <div class="pt-3 border-t border-slate-800/80 flex justify-between items-center text-[10px] text-slate-500">
                            <span>MÀJ : ${escapeHtml(m.date || 'Inconnue')}</span>
                            <div class="flex items-center gap-1">
                                <button onclick="editMedical('${key}')" title="Modifier" class="p-1.5 hover:bg-slate-800 rounded-lg text-slate-400 hover:text-blue-400 transition-colors">
                                    <i class="fa-solid fa-pen"></i>
                                </button>
                                <button onclick="deleteMedical('${key}')" title="Supprimer" class="p-1.5 hover:bg-slate-800 rounded-lg text-slate-400 hover:text-rose-400 transition-colors">
                                    <i class="fa-solid fa-trash"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Open Modal (Add Mode)
        function openModal() {
            document.getElementById('modalTitle').innerHTML = `<i class="fa-solid fa-file-medical"></i> Nouvelle Fiche Médicale`;
            document.getElementById('recordKey').value = '';
            document.getElementById('medicalForm').reset();
            document.getElementById('medicalModal').classList.remove('hidden');
        }

        // Close Modal
        function closeModal() {
            document.getElementById('medicalModal').classList.add('hidden');
        }

        // Edit Mode
        function editMedical(key) {
            const data = rawMedicalData[key];
            if (!data) return;

            document.getElementById('modalTitle').innerHTML = `<i class="fa-solid fa-pen-to-square"></i> Modifier Dossier Médical`;
            document.getElementById('recordKey').value = key;
            document.getElementById('formName').value = data.name || '';
            document.getElementById('formMat').value = data.mat || '';
            document.getElementById('formSang').value = data.sang || 'A+';
            document.getElementById('formVma').value = data.vma || '16';
            document.getElementById('formTap').value = data.tap ? "true" : "false";
            document.getElementById('formNotes').value = data.notes || '';

            document.getElementById('medicalModal').classList.remove('hidden');
        }

        // Form Submit (Push or Update)
        function handleFormSubmit(e) {
            e.preventDefault();
            const key = document.getElementById('recordKey').value;

            const payload = {
                name: document.getElementById('formName').value.trim(),
                mat: document.getElementById('formMat').value.trim(),
                sang: document.getElementById('formSang').value,
                vma: document.getElementById('formVma').value,
                tap: document.getElementById('formTap').value === 'true',
                notes: document.getElementById('formNotes').value.trim(),
                date: new Date().toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric' })
            };

            if (key) {
                // Update
                db.ref('medical/' + key).update(payload)
                    .then(() => closeModal())
                    .catch(err => alert("Erreur d'enregistrement : " + err.message));
            } else {
                // Insert
                db.ref('medical').push(payload)
                    .then(() => closeModal())
                    .catch(err => alert("Erreur de création : " + err.message));
            }
        }

        // Delete Entry
        function deleteMedical(key) {
            const record = rawMedicalData[key];
            const name = record ? record.name : 'ce dossier';
            
            if (confirm(`Êtes-vous sûr de vouloir supprimer définitivement le dossier médical de ${name} ?`)) {
                db.ref('medical/' + key).remove();
            }
        }
    </script>
</body>
</html>
