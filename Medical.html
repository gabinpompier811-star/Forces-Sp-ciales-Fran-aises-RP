<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Médical & Santé - FSF</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Firebase JS SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        body { 
            background-color: #060911; 
            font-family: system-ui, -apple-system, sans-serif;
        }
        .custom-card { 
            background: linear-gradient(145deg, #0d1527 0%, #080e1a 100%);
            border: 1px solid #1e293b;
            transition: all 0.2s ease-in-out;
        }
        .custom-card:hover {
            border-color: #f43f5e55;
            box-shadow: 0 12px 30px -10px rgba(244, 63, 94, 0.1);
            transform: translateY(-2px);
        }
        .modal-backdrop {
            background-color: rgba(3, 7, 18, 0.85);
            backdrop-filter: blur(10px);
        }
        .action-type-btn {
            background: #0f172a;
            border: 1px solid #1e293b;
            transition: all 0.2s ease;
        }
        .action-type-btn:hover {
            border-color: #f43f5e;
            background: #1e1b2e;
            transform: translateY(-2px);
        }
    </style>
</head>
<body class="text-slate-100 min-h-screen flex flex-col p-4 md:p-8 max-w-7xl mx-auto space-y-6">

    <!-- HEADER BAR -->
    <header class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 bg-slate-900/70 p-5 rounded-2xl border border-slate-800/80 backdrop-blur-md shadow-xl">
        <div class="flex items-center gap-4">
            <a href="index.html" class="px-3.5 py-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-xl text-xs font-bold text-slate-200 flex items-center gap-2 transition-all hover:scale-105">
                <i class="fa-solid fa-arrow-left"></i> Retour
            </a>
            <div>
                <h1 class="text-xl font-black text-rose-500 tracking-wide flex items-center gap-2.5">
                    <i class="fa-solid fa-heart-pulse animate-pulse text-rose-400"></i> Service Médical &amp; Santé
                </h1>
                <p class="text-xs text-slate-400 font-medium">Centre opérationnel de gestion des actes médicaux</p>
            </div>
        </div>

        <button onclick="openWizard()" class="w-full md:w-auto px-5 py-2.5 bg-gradient-to-r from-rose-600 to-rose-700 hover:from-rose-500 hover:to-rose-600 text-white font-bold text-xs rounded-xl shadow-lg shadow-rose-950/60 flex items-center justify-center gap-2 transition-all transform hover:-translate-y-0.5 cursor-pointer">
            <i class="fa-solid fa-plus-circle text-sm"></i> + Nouveau Dossier
        </button>
    </header>

    <!-- DASHBOARD STATS -->
    <section class="grid grid-cols-2 md:grid-cols-4 gap-4">
        <div class="bg-slate-900/50 border border-slate-800/80 p-4 rounded-2xl flex items-center gap-3.5 shadow-inner">
            <div class="p-3 bg-rose-500/10 text-rose-400 rounded-xl text-lg border border-rose-500/20"><i class="fa-solid fa-folder-open"></i></div>
            <div>
                <span class="text-[10px] uppercase font-bold text-slate-400 tracking-wider">Total Fiches</span>
                <p id="stat-total" class="text-xl font-black text-white">0</p>
            </div>
        </div>
        <div class="bg-slate-900/50 border border-slate-800/80 p-4 rounded-2xl flex items-center gap-3.5 shadow-inner">
            <div class="p-3 bg-emerald-500/10 text-emerald-400 rounded-xl text-lg border border-emerald-500/20"><i class="fa-solid fa-plane-departure"></i></div>
            <div>
                <span class="text-[10px] uppercase font-bold text-slate-400 tracking-wider">Aptitude TAP</span>
                <p id="stat-tap" class="text-xl font-black text-emerald-400">0%</p>
            </div>
        </div>
        <div class="bg-slate-900/50 border border-slate-800/80 p-4 rounded-2xl flex items-center gap-3.5 shadow-inner">
            <div class="p-3 bg-red-500/10 text-red-400 rounded-xl text-lg border border-red-500/20"><i class="fa-solid fa-kit-medical"></i></div>
            <div>
                <span class="text-[10px] uppercase font-bold text-slate-400 tracking-wider">Urgences Traitées</span>
                <p id="stat-urgences" class="text-xl font-black text-red-400">0</p>
            </div>
        </div>
        <div class="bg-slate-900/50 border border-slate-800/80 p-4 rounded-2xl flex items-center gap-3.5 shadow-inner">
            <div class="p-3 bg-amber-500/10 text-amber-400 rounded-xl text-lg border border-amber-500/20"><i class="fa-solid fa-user-xmark"></i></div>
            <div>
                <span class="text-[10px] uppercase font-bold text-slate-400 tracking-wider">Personnel Inapte</span>
                <p id="stat-inapte" class="text-xl font-black text-amber-400">0</p>
            </div>
        </div>
    </section>

    <!-- SEARCH & FILTERS BAR -->
    <div class="flex flex-col sm:flex-row gap-3 bg-slate-900/40 p-3 rounded-2xl border border-slate-800/80">
        <div class="relative flex-1">
            <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-slate-500 text-xs"></i>
            <input type="text" id="searchInput" oninput="renderCards()" placeholder="Rechercher par nom, matricule, type d'acte..." 
                   class="w-full bg-slate-950 border border-slate-800/80 rounded-xl pl-9 pr-4 py-2.5 text-xs text-slate-200 focus:outline-none focus:border-rose-500 transition-colors">
        </div>
        <select id="filterType" onchange="renderCards()" class="bg-slate-950 border border-slate-800/80 rounded-xl px-3 py-2.5 text-xs text-slate-300 focus:outline-none focus:border-rose-500">
            <option value="ALL">Tous les actes médicaux</option>
            <option value="Bilan d'urgence">Bilan d'urgence</option>
            <option value="Bilan complet">Bilan complet</option>
            <option value="Visite Médicale d'Aptitude">Visite Médicale d'Aptitude</option>
        </select>
    </div>

    <!-- CARDS CONTAINER -->
    <main id="medical-cards-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
        <!-- Rendu dynamique -->
    </main>

    <!-- MODAL PAS-À-PAS (WIZARD) -->
    <div id="medicalModal" class="fixed inset-0 z-50 hidden modal-backdrop flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl w-full max-w-xl p-6 md:p-8 shadow-2xl relative space-y-6">
            
            <div class="flex justify-between items-center border-b border-slate-800 pb-4">
                <h3 id="modalTitle" class="text-base font-bold text-rose-400 flex items-center gap-2.5">
                    <i class="fa-solid fa-file-medical text-lg"></i> Choisir le type de dossier
                </h3>
                <button onclick="closeModal()" class="w-8 h-8 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white flex items-center justify-center transition-colors cursor-pointer">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <!-- ÉTAPE 1 : 3 BOUTONS EXACTS -->
            <div id="step-1" class="space-y-3">
                <p class="text-xs text-slate-400 font-medium">Sélectionnez le type d'intervention médicale :</p>
                <div class="grid grid-cols-1 gap-3">
                    
                    <button onclick="selectType('Bilan d\'urgence', 'fa-kit-medical', 'text-rose-400')" class="action-type-btn p-4 rounded-2xl flex items-center gap-4 text-left cursor-pointer">
                        <div class="p-3 bg-rose-500/10 text-rose-400 rounded-xl text-xl"><i class="fa-solid fa-kit-medical"></i></div>
                        <div>
                            <span class="font-bold text-xs text-white block">Bilan d'urgence</span>
                            <span class="text-[10px] text-slate-400">Prise en charge rapide & traumatologie</span>
                        </div>
                    </button>

                    <button onclick="selectType('Bilan complet', 'fa-notes-medical', 'text-blue-400')" class="action-type-btn p-4 rounded-2xl flex items-center gap-4 text-left cursor-pointer">
                        <div class="p-3 bg-blue-500/10 text-blue-400 rounded-xl text-xl"><i class="fa-solid fa-notes-medical"></i></div>
                        <div>
                            <span class="font-bold text-xs text-white block">Bilan complet</span>
                            <span class="text-[10px] text-slate-400">XABCDE ; circonstenciel ; primaire ; secondaire ; surveillance etc...</span>
                        </div>
                    </button>

                    <button onclick="selectType('Visite Médicale d\'Aptitude', 'fa-plane-departure', 'text-emerald-400')" class="action-type-btn p-4 rounded-2xl flex items-center gap-4 text-left cursor-pointer">
                        <div class="p-3 bg-emerald-500/10 text-emerald-400 rounded-xl text-xl"><i class="fa-solid fa-plane-departure"></i></div>
                        <div>
                            <span class="font-bold text-xs text-white block">Visite Médicale d'Aptitude</span>
                            <span class="text-[10px] text-slate-400">Contrôle d'aptitude au service / TAP</span>
                        </div>
                    </button>

                </div>
            </div>

            <!-- ÉTAPE 2 : FORMULAIRE ADAPTÉ -->
            <form id="step-2" onsubmit="handleFormSubmit(event)" class="hidden space-y-4">
                <input type="hidden" id="recordKey">
                <input type="hidden" id="selectedType">

                <!-- Badge rappel du type choisi -->
                <div class="flex items-center justify-between bg-slate-950 p-3 rounded-xl border border-slate-800">
                    <span id="typeBadge" class="text-xs font-bold flex items-center gap-2"></span>
                    <button type="button" onclick="backToStep1()" class="text-[11px] text-slate-400 hover:text-white underline cursor-pointer">Changer</button>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
                    <div>
                        <label class="block text-[11px] font-bold text-slate-400 mb-1">Nom & Prénom *</label>
                        <input type="text" id="formName" required placeholder="ex: John Doe" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-rose-500">
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-slate-400 mb-1">Matricule *</label>
                        <input type="text" id="formMat" required placeholder="ex: FSF-042" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs font-mono text-blue-400 focus:outline-none focus:border-rose-500">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
                    <div>
                        <label class="block text-[11px] font-bold text-slate-400 mb-1">Groupe Sanguin *</label>
                        <select id="formSang" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-rose-500">
                            <option value="A+">A+</option><option value="A-">A-</option>
                            <option value="B+">B+</option><option value="B-">B-</option>
                            <option value="AB+">AB+</option><option value="AB-">AB-</option>
                            <option value="O+">O+</option><option value="O-">O-</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-slate-400 mb-1">Aptitude TAP *</label>
                        <select id="formTap" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-rose-500">
                            <option value="true">Apte</option>
                            <option value="false">Inapte</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-[11px] font-bold text-slate-400 mb-1">Constantes Vitales (Pouls, Tension, SpO2)</label>
                    <input type="text" id="formConstantes" placeholder="ex: 120/80 mmHg, 72 bpm, 98% SpO2" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-rose-500">
                </div>

                <div>
                    <label class="block text-[11px] font-bold text-slate-400 mb-1">Détails / XABCDE / Notes / Circonstances</label>
                    <textarea id="formNotes" rows="3" placeholder="Renseignez les détails du protocole, XABCDE, examen primaire/secondaire ou surveillance..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-rose-500 resize-none"></textarea>
                </div>

                <div class="flex justify-end gap-3 pt-4 border-t border-slate-800">
                    <button type="button" onclick="closeModal()" class="px-5 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl text-xs font-bold cursor-pointer">Annuler</button>
                    <button type="submit" class="px-6 py-2.5 bg-rose-600 hover:bg-rose-500 text-white rounded-xl text-xs font-bold shadow-lg shadow-rose-950/60 cursor-pointer">Valider &amp; Enregistrer</button>
                </div>
            </form>

        </div>
    </div>

    <!-- JAVASCRIPT -->
    <script>
        // Check Session Permissions
        const currentUser = JSON.parse(localStorage.getItem('fsf_user_session'));
        if (!currentUser || (!currentUser.isOwner && !(currentUser.perms || []).includes('MEDICAL'))) {
            alert("Accès non autorisé au Service Médical !");
            window.location.href = "index.html";
        }

        // Firebase Initialization
        const firebaseConfig = { databaseURL: "https://fsf-rp-default-rtdb.europe-west1.firebasedatabase.app" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let rawMedicalData = {};

        // Realtime Listener
        db.ref('medical').on('value', snapshot => {
            rawMedicalData = snapshot.val() || {};
            updateDashboardStats();
            renderCards();
        });

        // Safe HTML Sanitization (Anti-XSS)
        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // Dashboard Stats Calculation
        function updateDashboardStats() {
            const keys = Object.keys(rawMedicalData);
            const total = keys.length;

            if (total === 0) {
                document.getElementById('stat-total').innerText = '0';
                document.getElementById('stat-tap').innerText = '0%';
                document.getElementById('stat-urgences').innerText = '0';
                document.getElementById('stat-inapte').innerText = '0';
                return;
            }

            let tapCount = 0;
            let urgencesCount = 0;
            let inapteCount = 0;

            keys.forEach(k => {
                const item = rawMedicalData[k];
                if (item.tap) tapCount++;
                else inapteCount++;
                if (item.typeBilan === "Bilan d'urgence") urgencesCount++;
            });

            document.getElementById('stat-total').innerText = total;
            document.getElementById('stat-tap').innerText = Math.round((tapCount / total) * 100) + '%';
            document.getElementById('stat-urgences').innerText = urgencesCount;
            document.getElementById('stat-inapte').innerText = inapteCount;
        }

        // Render Cards
        function renderCards() {
            const container = document.getElementById('medical-cards-container');
            const search = document.getElementById('searchInput').value.toLowerCase();
            const typeFilter = document.getElementById('filterType').value;

            const keys = Object.keys(rawMedicalData).filter(key => {
                const m = rawMedicalData[key];
                const matchSearch = (m.name || '').toLowerCase().includes(search) || 
                                    (m.mat || '').toLowerCase().includes(search) ||
                                    (m.typeBilan || '').toLowerCase().includes(search) ||
                                    (m.sang || '').toLowerCase().includes(search);
                
                const matchType = typeFilter === 'ALL' || (m.typeBilan === typeFilter);
                return matchSearch && matchType;
            });

            if (keys.length === 0) {
                container.innerHTML = `
                    <div class="col-span-1 md:col-span-2 lg:col-span-3 text-center py-16 border border-dashed border-slate-800 rounded-3xl bg-slate-900/20">
                        <i class="fa-solid fa-folder-open text-4xl text-slate-600 mb-3"></i>
                        <p class="text-xs text-slate-400 font-medium">Aucun dossier médical enregistré.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = keys.map(key => {
                const m = rawMedicalData[key];
                const isTap = !!m.tap;
                const isUrgence = m.typeBilan === "Bilan d'urgence";

                return `
                    <div class="custom-card p-5 rounded-3xl space-y-4 shadow-xl flex flex-col justify-between ${isUrgence ? 'border-rose-900/50 bg-rose-950/10' : ''}">
                        <div class="space-y-3">
                            <!-- Header Card -->
                            <div class="flex justify-between items-start border-b border-slate-800/80 pb-3">
                                <div>
                                    <h3 class="font-black text-white text-sm tracking-wide">${escapeHtml(m.name)}</h3>
                                    <span class="text-[11px] text-blue-400 font-mono font-semibold">MAT : ${escapeHtml(m.mat)}</span>
                                </div>
                                <span class="px-2.5 py-1 bg-rose-950/80 text-rose-300 border border-rose-800/60 rounded-xl text-[10px] font-black">
                                    <i class="fa-solid fa-droplet text-rose-500 mr-1"></i>${escapeHtml(m.sang || 'N/A')}
                                </span>
                            </div>

                            <!-- Metrics -->
                            <div class="grid grid-cols-2 gap-2 text-xs bg-slate-950/50 p-3 rounded-2xl border border-slate-800/50">
                                <div class="flex flex-col">
                                    <span class="text-[10px] text-slate-500 font-bold uppercase tracking-wider">Type de Bilan</span>
                                    <span class="font-bold mt-0.5 truncate ${isUrgence ? 'text-rose-400' : 'text-slate-200'}">${escapeHtml(m.typeBilan || 'Bilan complet')}</span>
                                </div>
                                <div class="flex flex-col">
                                    <span class="text-[10px] text-slate-500 font-bold uppercase tracking-wider">Aptitude TAP</span>
                                    <span class="${isTap ? 'text-emerald-400' : 'text-rose-400'} font-bold flex items-center gap-1 mt-0.5">
                                        <i class="fa-solid ${isTap ? 'fa-circle-check' : 'fa-circle-xmark'}"></i> ${isTap ? 'Apte' : 'Inapte'}
                                    </span>
                                </div>
                            </div>

                            ${m.constantes ? `
                                <div class="text-[11px] text-slate-300 bg-slate-900/40 px-3 py-2 rounded-xl border border-slate-800/80 flex items-center gap-2">
                                    <i class="fa-solid fa-heart-pulse text-rose-400"></i>
                                    <span>Constantes : <strong class="text-white">${escapeHtml(m.constantes)}</strong></span>
                                </div>
                            ` : ''}

                            ${m.notes ? `
                                <div class="text-[11px] text-slate-400 bg-slate-900/60 p-2.5 rounded-xl border border-slate-800 italic">
                                    "${escapeHtml(m.notes)}"
                                </div>
                            ` : ''}
                        </div>

                        <!-- Card Footer -->
                        <div class="pt-3 border-t border-slate-800/80 flex justify-between items-center text-[10px] text-slate-500">
                            <span>Mise à jour : ${escapeHtml(m.date || 'Récemment')}</span>
                            <div class="flex items-center gap-1.5">
                                <button onclick="editMedical('${key}')" title="Modifier" class="p-2 bg-slate-800/50 hover:bg-slate-800 rounded-xl text-slate-300 hover:text-blue-400 transition-colors cursor-pointer">
                                    <i class="fa-solid fa-pen"></i>
                                </button>
                                <button onclick="deleteMedical('${key}')" title="Supprimer" class="p-2 bg-slate-800/50 hover:bg-slate-800 rounded-xl text-slate-300 hover:text-rose-400 transition-colors cursor-pointer">
                                    <i class="fa-solid fa-trash"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // --- GESTION DU WIZARD (PAS À PAS) ---

        function openWizard() {
            document.getElementById('recordKey').value = '';
            document.getElementById('step-1').classList.remove('hidden');
            document.getElementById('step-2').classList.add('hidden');
            document.getElementById('modalTitle').innerHTML = `<i class="fa-solid fa-file-medical text-lg"></i> Choisir le type de dossier`;
            document.getElementById('medicalModal').classList.remove('hidden');
        }

        function selectType(typeName, iconClass, colorClass) {
            document.getElementById('selectedType').value = typeName;
            document.getElementById('typeBadge').innerHTML = `<i class="fa-solid ${iconClass} ${colorClass}"></i> Dossier : ${typeName}`;
            
            document.getElementById('step-1').classList.add('hidden');
            document.getElementById('step-2').classList.remove('hidden');
            document.getElementById('modalTitle').innerHTML = `<i class="fa-solid fa-pen-to-square text-lg"></i> Renseigner le dossier`;
        }

        function backToStep1() {
            document.getElementById('step-2').classList.add('hidden');
            document.getElementById('step-1').classList.remove('hidden');
            document.getElementById('modalTitle').innerHTML = `<i class="fa-solid fa-file-medical text-lg"></i> Choisir le type de dossier`;
        }

        function closeModal() {
            document.getElementById('medicalModal').classList.add('hidden');
            document.getElementById('step-2').reset();
        }

        // ÉDITION DE FICHE
        function editMedical(key) {
            const data = rawMedicalData[key];
            if (!data) return;

            document.getElementById('recordKey').value = key;
            document.getElementById('selectedType').value = data.typeBilan || 'Bilan complet';
            document.getElementById('typeBadge').innerHTML = `<i class="fa-solid fa-pen-to-square text-blue-400"></i> Modification du dossier`;
            
            document.getElementById('formName').value = data.name || '';
            document.getElementById('formMat').value = data.mat || '';
            document.getElementById('formSang').value = data.sang || 'A+';
            document.getElementById('formTap').value = data.tap ? "true" : "false";
            document.getElementById('formConstantes').value = data.constantes || '';
            document.getElementById('formNotes').value = data.notes || '';

            document.getElementById('step-1').classList.add('hidden');
            document.getElementById('step-2').classList.remove('hidden');
            document.getElementById('modalTitle').innerHTML = `<i class="fa-solid fa-pen-to-square text-lg"></i> Modifier la fiche`;
            document.getElementById('medicalModal').classList.remove('hidden');
        }

        // SOUMISSION FORMULAIRE
        function handleFormSubmit(e) {
            e.preventDefault();
            const key = document.getElementById('recordKey').value;

            const payload = {
                name: document.getElementById('formName').value.trim(),
                mat: document.getElementById('formMat').value.trim(),
                typeBilan: document.getElementById('selectedType').value,
                sang: document.getElementById('formSang').value,
                tap: document.getElementById('formTap').value === 'true',
                constantes: document.getElementById('formConstantes').value.trim(),
                notes: document.getElementById('formNotes').value.trim(),
                date: new Date().toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric' })
            };

            if (key) {
                db.ref('medical/' + key).update(payload)
                    .then(() => closeModal())
                    .catch(err => alert("Erreur d'enregistrement : " + err.message));
            } else {
                db.ref('medical').push(payload)
                    .then(() => closeModal())
                    .catch(err => alert("Erreur de création : " + err.message));
            }
        }

        // SUPPRESSION
        function deleteMedical(key) {
            const record = rawMedicalData[key];
            const name = record ? record.name : 'ce dossier';
            
            if (confirm(`Voulez-vous vraiment supprimer le dossier médical de ${name} ?`)) {
                db.ref('medical/' + key).remove();
            }
        }
    </script>
</body>
</html>
