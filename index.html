<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portail Stratégique - FSF / ENA</title>
    <!-- CSS Tailwind via CDN pour un style rapide et propre -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- 1. PAGE DE CONNEXION / INSCRIPTION -->
    <div id="auth-screen" class="flex-1 flex items-center justify-center p-4">
        <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl space-y-6">
            <div class="text-center space-y-2">
                <div class="inline-flex p-3 bg-blue-500/10 border border-blue-500/20 rounded-xl text-blue-500 mb-2">
                    <i class="fa-solid fa-shield-halved text-3xl"></i>
                </div>
                <h1 class="text-2xl font-bold tracking-wide">Accès Portail Métier</h1>
                <p class="text-xs text-slate-400">Identification requise pour accéder aux modules</p>
            </div>

            <form id="auth-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">IDENTIFIANT / EMAIL</label>
                    <input type="email" id="user-email" required placeholder="nom@domaine.fr" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-sm focus:border-blue-500 outline-none text-slate-100">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">MOT DE PASSE</label>
                    <input type="password" required placeholder="••••••••" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-sm focus:border-blue-500 outline-none text-slate-100">
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-lg shadow-lg shadow-blue-950/50 transition duration-200">
                    Se connecter / S'inscrire
                </button>
            </form>
        </div>
    </div>

    <!-- 2. TABLEAU DE BORD PRINCIPAL (Catégories) -->
    <div id="main-dashboard" class="hidden flex-1 flex flex-col">
        <!-- Barre supérieure -->
        <header class="bg-slate-900 border-b border-slate-800 px-6 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-shield-halved text-blue-500 text-xl"></i>
                <span class="font-bold tracking-wider text-sm">PORTAIL DE COMMANDEMENT</span>
            </div>
            <div class="flex items-center gap-4">
                <span id="display-user" class="text-xs font-mono text-blue-400 bg-blue-500/10 px-3 py-1 rounded-full border border-blue-500/20"></span>
                <button id="logout-btn" class="bg-red-900/40 hover:bg-red-800/60 border border-red-700/50 text-red-300 text-xs px-3 py-1.5 rounded-lg transition">
                    Déconnexion
                </button>
            </div>
        </header>

        <!-- Grille des 6 catégories -->
        <main class="flex-1 p-6 max-w-6xl mx-auto w-full space-y-6">
            <div class="border-b border-slate-800 pb-4">
                <h2 class="text-xl font-bold text-white">Sélectionnez un Module</h2>
                <p class="text-xs text-slate-400 mt-1">Chaque catégorie exécute son propre environnement dédié</p>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                
                <!-- Catégorie 1 : ENA -->
                <button onclick="runCategoryScript('ENA')" class="group text-left bg-slate-900 border border-slate-800 hover:border-blue-500/50 p-5 rounded-2xl transition duration-200 shadow-lg hover:-translate-y-1">
                    <div class="p-3 bg-blue-500/10 border border-blue-500/20 rounded-xl text-blue-400 w-fit mb-3 group-hover:scale-110 transition">
                        <i class="fa-solid fa-graduation-cap text-xl"></i>
                    </div>
                    <h3 class="font-bold text-base text-white">ENA</h3>
                    <p class="text-xs text-slate-400 mt-1">École Nationale d'Apprentissage & Formations</p>
                </button>

                <!-- Catégorie 2 : Forces Spéciales Françaises -->
                <button onclick="runCategoryScript('FSF')" class="group text-left bg-slate-900 border border-slate-800 hover:border-red-500/50 p-5 rounded-2xl transition duration-200 shadow-lg hover:-translate-y-1">
                    <div class="p-3 bg-red-500/10 border border-red-500/20 rounded-xl text-red-400 w-fit mb-3 group-hover:scale-110 transition">
                        <i class="fa-solid fa-user-ninja text-xl"></i>
                    </div>
                    <h3 class="font-bold text-base text-white">Forces Spéciales Françaises</h3>
                    <p class="text-xs text-slate-400 mt-1">Dossiers opérateurs & Unités d'élite</p>
                </button>

                <!-- Catégorie 3 : COS / EMA -->
                <button onclick="runCategoryScript('COS_EMA')" class="group text-left bg-slate-900 border border-slate-800 hover:border-amber-500/50 p-5 rounded-2xl transition duration-200 shadow-lg hover:-translate-y-1">
                    <div class="p-3 bg-amber-500/10 border border-amber-500/20 rounded-xl text-amber-400 w-fit mb-3 group-hover:scale-110 transition">
                        <i class="fa-solid fa-star text-xl"></i>
                    </div>
                    <h3 class="font-bold text-base text-white">COS / EMA</h3>
                    <p class="text-xs text-slate-400 mt-1">Commandement des Opérations & État-Major</p>
                </button>

                <!-- Catégorie 4 : Administration -->
                <button onclick="runCategoryScript('ADMINISTRATION')" class="group text-left bg-slate-900 border border-slate-800 hover:border-emerald-500/50 p-5 rounded-2xl transition duration-200 shadow-lg hover:-translate-y-1">
                    <div class="p-3 bg-emerald-500/10 border border-emerald-500/20 rounded-xl text-emerald-400 w-fit mb-3 group-hover:scale-110 transition">
                        <i class="fa-solid fa-folder-tree text-xl"></i>
                    </div>
                    <h3 class="font-bold text-base text-white">Administration</h3>
                    <p class="text-xs text-slate-400 mt-1">Gestion administrative & Registres officiels</p>
                </button>

                <!-- Catégorie 5 : Fondation -->
                <button onclick="runCategoryScript('FONDATION')" class="group text-left bg-slate-900 border border-slate-800 hover:border-purple-500/50 p-5 rounded-2xl transition duration-200 shadow-lg hover:-translate-y-1">
                    <div class="p-3 bg-purple-500/10 border border-purple-500/20 rounded-xl text-purple-400 w-fit mb-3 group-hover:scale-110 transition">
                        <i class="fa-solid fa-shield-cat text-xl"></i>
                    </div>
                    <h3 class="font-bold text-base text-white">Fondation</h3>
                    <p class="text-xs text-slate-400 mt-1">Espace Modérateurs, Staff & Gestion globale</p>
                </button>

                <!-- Catégorie 6 : Régiments -->
                <button onclick="runCategoryScript('REGIMENTS')" class="group text-left bg-slate-900 border border-slate-800 hover:border-cyan-500/50 p-5 rounded-2xl transition duration-200 shadow-lg hover:-translate-y-1">
                    <div class="p-3 bg-cyan-500/10 border border-cyan-500/20 rounded-xl text-cyan-400 w-fit mb-3 group-hover:scale-110 transition">
                        <i class="fa-solid fa-person-military-rifle text-xl"></i>
                    </div>
                    <h3 class="font-bold text-base text-white">Régiments</h3>
                    <p class="text-xs text-slate-400 mt-1">Répertoire & Effectifs des régiments</p>
                </button>

            </div>
        </main>
    </div>

    <!-- 3. LOGIQUE JAVASCRIPT DES SCRIPTS -->
    <script>
        const authScreen = document.getElementById('auth-screen');
        const mainDashboard = document.getElementById('main-dashboard');
        const authForm = document.getElementById('auth-form');
        const userEmailInput = document.getElementById('user-email');
        const displayUser = document.getElementById('display-user');
        const logoutBtn = document.getElementById('logout-btn');

        // Connexion
        authForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const email = userEmailInput.value;
            displayUser.textContent = email;
            
            // Masque la connexion et affiche le dashboard
            authScreen.classList.add('hidden');
            mainDashboard.classList.remove('hidden');
        });

        // Déconnexion
        logoutBtn.addEventListener('click', () => {
            mainDashboard.classList.add('hidden');
            authScreen.classList.remove('hidden');
        });

        // Fonction qui déclenche le script spécifique à chaque catégorie
        function runCategoryScript(categoryKey) {
            console.log("Lancement du script pour : " + categoryKey);

            switch(categoryKey) {
                case 'ENA':
                    scriptENA();
                    break;
                case 'FSF':
                    scriptFSF();
                    break;
                case 'COS_EMA':
                    scriptCOS();
                    break;
                case 'ADMINISTRATION':
                    scriptAdmin();
                    break;
                case 'FONDATION':
                    scriptFondation();
                    break;
                case 'REGIMENTS':
                    scriptRegiments();
                    break;
                default:
                    alert("Module inconnu");
            }
        }

        // ==========================================
        //  EMPLACEMENT DE TES DIFFÉRENTS SCRIPTS
        // ==========================================

        function scriptENA() {
            alert("▶ Exécution du Script ENA (Formations, Diplômes, Examens)");
            // Insère ici la logique spécifique pour l'ENA
        }

        function scriptFSF() {
            alert("▶ Exécution du Script Forces Spéciales Françaises (Dossiers Opérateurs, VMA)");
            // Insère ici la logique spécifique pour la FSF
        }

        function scriptCOS() {
            alert("▶ Exécution du Script COS / EMA (Ordres de Mission, État-Major)");
            // Insère ici la logique spécifique pour le COS/EMA
        }

        function scriptAdmin() {
            alert("▶ Exécution du Script Administration (Rôles, Whitelist, Logs)");
            // Insère ici la logique spécifique pour l'Administration
        }

        function scriptFondation() {
            alert("▶ Exécution du Script Fondation (Espace Staff, Modération)");
            // Insère ici la logique spécifique pour la Fondation
        }

        function scriptRegiments() {
            alert("▶ Exécution du Script Régiments (CPA 10, 13e RDP, Jaubert, GCP, 4e RHFS)");
            // Insère ici la logique spécifique pour les Régiments
        }
    </script>
</body>
</html>
