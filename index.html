<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portail Stratégique FSF / ENA - Sync Realtime</title>
    <!-- Tailwind CSS & Font Awesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDK Compat (App & Realtime Database) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        :root { --site-brightness: 100%; --bg-main: #090d16; --bg-card: #0f172a; --border-card: #1e293b; }
        body[data-theme="dark"] { --bg-main: #090d16; --bg-card: #0f172a; --border-card: #1e293b; }
        body[data-theme="deep-night"] { --bg-main: #020408; --bg-card: #090d16; --border-card: #131c2e; }
        body { background-color: var(--bg-main); filter: brightness(var(--site-brightness)); transition: filter 0.15s ease-out, background-color 0.3s ease; }
        .custom-card { background-color: var(--bg-card); border-color: var(--border-card); }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #090d16; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
    </style>
</head>
<body class="text-slate-100 min-h-screen flex flex-col font-sans antialiased selection:bg-blue-500 selection:text-white">

    <!-- 1. CONNEXION -->
    <div id="auth-screen" class="flex-1 flex items-center justify-center p-4 bg-gradient-to-br from-slate-950 via-slate-900 to-slate-950">
        <div class="w-full max-w-md custom-card border rounded-3xl p-8 shadow-2xl space-y-6">
            <div class="text-center space-y-3">
                <div class="inline-flex p-4 bg-blue-500/10 border border-blue-500/20 rounded-2xl text-blue-400 shadow-inner">
                    <i class="fa-solid fa-wifi text-4xl animate-pulse"></i>
                </div>
                <h1 class="text-2xl font-black tracking-wider text-white">PORTAIL FSF / ENA</h1>
                <p class="text-xs text-slate-400">Connexion Réseau Realtime Database</p>
            </div>

            <form id="auth-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-400 mb-1.5 uppercase">Identifiant / Email</label>
                    <input type="email" id="user-email" required placeholder="gabinpompier811@gmail.com" class="w-full bg-slate-950/80 border border-slate-800 rounded-xl py-3 px-4 text-sm focus:border-blue-500 outline-none text-slate-100">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 mb-1.5 uppercase">Mot de passe</label>
                    <input type="password" required placeholder="••••••••" class="w-full bg-slate-950/80 border border-slate-800 rounded-xl py-3 px-4 text-sm focus:border-blue-500 outline-none text-slate-100">
                </div>
                <button type="submit" class="w-full bg-gradient-to-r from-blue-600 to-blue-700 hover:from-blue-500 text-white font-bold py-3.5 rounded-xl shadow-lg cursor-pointer">
                    Accéder au Portail <i class="fa-solid fa-arrow-right-to-bracket ml-2"></i>
                </button>
            </form>
        </div>
    </div>

    <!-- 2. INITIALISATION DU PROFIL -->
    <div id="profile-modal" class="hidden fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4">
        <div class="w-full max-w-lg custom-card border rounded-3xl p-8 shadow-2xl space-y-6">
            <h2 class="text-xl font-bold text-white text-center">Initialisation du Profil Opérateur</h2>
            <form id="profile-form" class="space-y-4 text-xs">
                <div>
                    <label class="block font-bold text-slate-300 mb-1.5">Pseudo / Nom d'affichage *</label>
                    <input type="text" id="input-username" required placeholder="ex: Capitaine Noli VELMONT" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white outline-none">
                </div>
                <div>
                    <label class="block font-bold text-slate-300 mb-1.5">Matricule / Code Opérateur</label>
                    <input type="text" id="input-matricule" placeholder="ex: FS-027-FR" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-slate-300 outline-none">
                </div>
                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl shadow-lg cursor-pointer">Enregistrer</button>
            </form>
        </div>
    </div>

    <!-- 3. DASHBOARD PRINCIPAL -->
    <div id="main-dashboard" class="hidden flex-1 flex flex-col">
        <header class="bg-slate-900/90 backdrop-blur-md border-b border-slate-800 px-6 py-4 flex justify-between items-center sticky top-0 z-30">
            <div class="flex items-center gap-3">
                <div class="p-2 bg-blue-500/10 border border-blue-500/20 rounded-xl text-blue-400">
                    <i class="fa-solid fa-shield-halved text-lg"></i>
                </div>
                <div>
                    <span class="font-black tracking-widest text-sm text-white block">PORTAIL COMMANDEMENT</span>
                    <span class="text-[10px] text-emerald-400 uppercase tracking-wide flex items-center gap-1">
                        <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-ping"></span> Realtime DB Connecté
                    </span>
                </div>
            </div>

            <div class="flex items-center gap-3">
                <div class="hidden sm:flex flex-col text-right border-r border-slate-800 pr-4">
                    <span id="display-username" class="text-xs font-bold text-slate-100">---</span>
                    <span id="display-matricule" class="text-[10px] text-blue-400 font-mono">FS-000-FR</span>
                </div>
                <button id="open-settings-btn" class="p-2.5 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded-xl transition flex items-center gap-2 text-xs font-bold cursor-pointer">
                    <i class="fa-solid fa-gear text-blue-400"></i>
                </button>
                <button id="logout-btn" class="p-2.5 bg-red-950/50 hover:bg-red-900/80 border border-red-800/60 text-red-300 rounded-xl transition flex items-center gap-2 text-xs font-bold cursor-pointer">
                    <i class="fa-solid fa-power-off"></i>
                </button>
            </div>
        </header>

        <main class="flex-1 p-6 md:p-10 max-w-7xl mx-auto w-full space-y-8">
            <div id="view-home" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <button onclick="openCategory('ENA')" class="group text-left custom-card border hover:border-blue-500/60 p-6 rounded-3xl transition-all shadow-xl cursor-pointer">
                    <div class="p-3.5 bg-blue-500/10 border border-blue-500/20 rounded-2xl text-blue-400 w-fit mb-4"><i class="fa-solid fa-graduation-cap text-2xl"></i></div>
                    <h3 class="font-bold text-lg text-white group-hover:text-blue-400 transition">ENA &amp; Formations</h3>
                    <p class="text-xs text-slate-400 mt-2">Gestion des unités, notes et plannings en direct.</p>
                </button>

                <button onclick="openCategory('FONDATION')" class="group text-left custom-card border hover:border-purple-500/60 p-6 rounded-3xl transition-all shadow-xl cursor-pointer">
                    <div class="p-3.5 bg-purple-500/10 border border-purple-500/20 rounded-2xl text-purple-400 w-fit mb-4"><i class="fa-solid fa-shield-cat text-2xl"></i></div>
                    <h3 class="font-bold text-lg text-white group-hover:text-purple-400 transition">Fondation (Staff)</h3>
                    <p class="text-xs text-slate-400 mt-2">Gestion globale des permissions et demandes d'accès.</p>
                </button>
            </div>

            <div id="view-category" class="hidden space-y-6">
                <button onclick="goHome()" class="px-4 py-2 bg-slate-900 border border-slate-700 text-slate-200 rounded-xl text-xs font-bold transition flex items-center gap-2 cursor-pointer">
                    <i class="fa-solid fa-arrow-left"></i> Retour au menu
                </button>
                <div id="category-content-container" class="custom-card border rounded-3xl p-8 shadow-2xl"></div>
            </div>
        </main>
    </div>

    <!-- 4. PANNEAU PARAMÈTRES -->
    <div id="settings-drawer" class="hidden fixed inset-0 z-50 bg-slate-950/60 backdrop-blur-sm flex justify-end">
        <div class="w-full max-w-md bg-slate-900 border-l border-slate-800 h-full p-6 shadow-2xl space-y-6 flex flex-col justify-between">
            <div class="space-y-6">
                <div class="flex justify-between items-center border-b border-slate-800 pb-4">
                    <h3 class="text-lg font-bold text-white flex items-center gap-2"><i class="fa-solid fa-sliders text-blue-400"></i> Paramètres</h3>
                    <button id="close-settings-btn" class="p-2 text-slate-400 hover:text-white rounded-lg"><i class="fa-solid fa-xmark text-lg"></i></button>
                </div>
                <div class="space-y-3 bg-slate-950 p-4 rounded-2xl border border-slate-800">
                    <label class="text-xs font-bold text-slate-300">Luminosité Interface</label>
                    <input type="range" id="brightness-range" min="30" max="100" value="100" class="w-full accent-blue-500 cursor-pointer">
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- CONFIGURATION FIREBASE REALTIME DATABASE ---
        const firebaseConfig = {
            databaseURL: "https://fsf-rp-default-rtdb.europe-west1.firebasedatabase.app"
        };

        // Initialisation de Firebase Realtime DB
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Variables globales
        let userProfile = JSON.parse(localStorage.getItem('fsf_user_profile')) || null;
        let activeNoteId = null;

        // Dom Elements
        const authScreen = document.getElementById('auth-screen');
        const mainDashboard = document.getElementById('main-dashboard');
        const authForm = document.getElementById('auth-form');
        const profileModal = document.getElementById('profile-modal');
        const profileForm = document.getElementById('profile-form');
        const settingsDrawer = document.getElementById('settings-drawer');
        const viewHome = document.getElementById('view-home');
        const viewCategory = document.getElementById('view-category');
        const categoryContentContainer = document.getElementById('category-content-container');

        // --- AUTHENTIFICATION ---
        authForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('user-email').value;
            userProfile = { email: email, username: email.split('@')[0], matricule: 'FS-001-FR' };
            localStorage.setItem('fsf_user_profile', JSON.stringify(userProfile));
            authScreen.classList.add('hidden');
            if (!userProfile.usernameSet) {
                profileModal.classList.remove('hidden');
            } else {
                loadDashboard();
            }
        });

        profileForm.addEventListener('submit', (e) => {
            e.preventDefault();
            userProfile.username = document.getElementById('input-username').value;
            userProfile.matricule = document.getElementById('input-matricule').value || 'FS-001-FR';
            userProfile.usernameSet = true;
            localStorage.setItem('fsf_user_profile', JSON.stringify(userProfile));
            profileModal.classList.add('hidden');
            loadDashboard();
        });

        function loadDashboard() {
            document.getElementById('display-username').textContent = userProfile.username;
            document.getElementById('display-matricule').textContent = userProfile.matricule;
            mainDashboard.classList.remove('hidden');
        }

        function openCategory(key) {
            viewHome.classList.add('hidden');
            viewCategory.classList.remove('hidden');
            if (key === 'ENA') renderEnaWorkspace();
            if (key === 'FONDATION') renderFondationWorkspace();
        }

        function goHome() {
            viewCategory.classList.add('hidden');
            viewHome.classList.remove('hidden');
        }

        // ==========================================
        //  MODULE ENA WORKSPACE (REALTIME DATABASE)
        // ==========================================
        function renderEnaWorkspace() {
            categoryContentContainer.innerHTML = `
                <div class="space-y-6">
                    <div class="flex gap-2 border-b border-slate-800 pb-2 text-xs font-bold">
                        <button onclick="switchEnaTab('unités')" id="tab-btn-unités" class="px-4 py-2 bg-blue-600 text-white rounded-xl">Unités &amp; Sections</button>
                        <button onclick="switchEnaTab('notes')" id="tab-btn-notes" class="px-4 py-2 bg-slate-900 border border-slate-800 text-slate-300 rounded-xl">Notes &amp; Directives</button>
                        <button onclick="switchEnaTab('plannings')" id="tab-btn-plannings" class="px-4 py-2 bg-slate-900 border border-slate-800 text-slate-300 rounded-xl">Plannings Live</button>
                    </div>

                    <!-- 1. UNITÉS -->
                    <div id="ena-content-unités" class="space-y-4">
                        <div class="flex justify-between items-center">
                            <h3 class="text-sm font-bold text-white">Répertoire des Unités Forces Spéciales</h3>
                            <button onclick="createNewUnitPrompt()" class="px-3 py-2 bg-blue-600 hover:bg-blue-500 rounded-xl text-xs font-bold cursor-pointer">+ Créer Unité</button>
                        </div>
                        <div id="units-grid-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
                    </div>

                    <!-- 2. NOTES -->
                    <div id="ena-content-notes" class="hidden space-y-4">
                        <div class="flex justify-between items-center">
                            <button onclick="createNewNoteDB()" class="px-4 py-2 bg-blue-600 text-white text-xs font-bold rounded-xl cursor-pointer">+ Nouvelle Note</button>
                        </div>
                        <div class="grid grid-cols-1 lg:grid-cols-12 gap-4">
                            <div id="notes-list-container" class="lg:col-span-4 space-y-2"></div>
                            <div id="note-editor-container" class="lg:col-span-8 bg-slate-950 p-4 border border-slate-800 rounded-xl">
                                <p class="text-xs text-slate-500 italic">Sélectionnez une note à gauche pour éditer en direct.</p>
                            </div>
                        </div>
                    </div>

                    <!-- 3. PLANNINGS -->
                    <div id="ena-content-plannings" class="hidden space-y-4">
                        <form onsubmit="addSessionDB(event)" class="bg-slate-950 p-4 border border-slate-800 rounded-xl space-y-3 text-xs">
                            <h4 class="font-bold text-white uppercase">Programmer une Session</h4>
                            <input type="text" id="sess-title" required placeholder="Nom de la session / Formation" class="w-full bg-slate-900 p-2.5 rounded-lg border border-slate-800 text-white outline-none">
                            <input type="datetime-local" id="sess-time" required class="w-full bg-slate-900 p-2.5 rounded-lg border border-slate-800 text-white outline-none">
                            <button type="submit" class="w-full bg-blue-600 py-2.5 rounded-lg font-bold text-white cursor-pointer">Publier la Session Live</button>
                        </form>
                        <div id="sessions-list-container" class="grid grid-cols-1 md:grid-cols-2 gap-3"></div>
                    </div>
                </div>
            `;

            listenUnitsDB();
            listenNotesDB();
            listenSessionsDB();
        }

        // --- UNITÉS (LISTEN & WRITE) ---
        function listenUnitsDB() {
            db.ref('units').on('value', snapshot => {
                const container = document.getElementById('units-grid-container');
                if (!container) return;
                const data = snapshot.val();
                if (!data) {
                    container.innerHTML = `<p class="text-xs text-slate-500 italic col-span-3">Aucune unité créée dans la base.</p>`;
                    return;
                }

                container.innerHTML = Object.keys(data).map(key => {
                    const u = data[key];
                    const members = u.members ? Object.values(u.members) : [];
                    return `
                        <div class="bg-slate-950 border border-slate-800 p-4 rounded-2xl space-y-3">
                            <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                                <span class="font-bold text-xs text-white">${u.name}</span>
                                <button onclick="deleteUnitDB('${key}')" class="text-red-400 text-xs hover:text-red-300 cursor-pointer"><i class="fa-solid fa-trash"></i></button>
                            </div>
                            <div class="space-y-1.5">
                                ${members.map(m => `
                                    <div class="bg-slate-900 p-2 rounded-lg text-xs flex justify-between">
                                        <span class="font-bold text-slate-200">${m.name}</span>
                                        <span class="font-mono text-[10px] text-blue-400">${m.matricule}</span>
                                    </div>
                                `).join('')}
                            </div>
                            <button onclick="addMemberToUnitPrompt('${key}')" class="w-full py-1.5 bg-slate-900 hover:bg-slate-800 text-xs font-bold text-slate-300 rounded-lg border border-slate-800 cursor-pointer">+ Ajouter membre</button>
                        </div>
                    `;
                }).join('');
            });
        }

        function createNewUnitPrompt() {
            const name = prompt("Nom de la nouvelle unité :");
            if (name) db.ref('units').push({ name: name });
        }

        function deleteUnitDB(key) {
            db.ref('units/' + key).remove();
        }

        function addMemberToUnitPrompt(unitKey) {
            const name = prompt("Nom & Prénom du militaire :");
            const mat = prompt("Matricule :");
            if (name && mat) {
                db.ref('units/' + unitKey + '/members').push({ name: name, matricule: mat });
            }
        }

        // --- NOTES (LISTEN & WRITE) ---
        function listenNotesDB() {
            db.ref('notes').on('value', snapshot => {
                const container = document.getElementById('notes-list-container');
                if (!container) return;
                const data = snapshot.val();
                if (!data) {
                    container.innerHTML = `<p class="text-xs text-slate-500 italic">Aucune note enregistrée.</p>`;
                    return;
                }

                container.innerHTML = Object.keys(data).map(key => {
                    const n = data[key];
                    return `
                        <div onclick="openNoteEditorDB('${key}', \`${n.title || ''}\`, \`${n.content || ''}\`)" class="p-3 bg-slate-950 border border-slate-800 hover:border-blue-500/50 rounded-xl flex justify-between items-center cursor-pointer">
                            <span class="font-bold text-xs text-white truncate">${n.title || 'Sans titre'}</span>
                            <button onclick="event.stopPropagation(); deleteNoteDB('${key}')" class="text-slate-500 hover:text-red-400 text-xs cursor-pointer"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    `;
                }).join('');
            });
        }

        function createNewNoteDB() {
            db.ref('notes').push({ title: "Nouvelle Note Sync", content: "" });
        }

        function openNoteEditorDB(key, title, content) {
            activeNoteId = key;
            const editor = document.getElementById('note-editor-container');
            if (!editor) return;
            editor.innerHTML = `
                <div class="space-y-3">
                    <input type="text" value="${title}" oninput="updateNoteDB('${key}', 'title', this.value)" class="w-full bg-slate-900 border border-slate-800 p-2.5 rounded-lg text-xs font-bold text-white outline-none">
                    <textarea oninput="updateNoteDB('${key}', 'content', this.value)" rows="8" class="w-full bg-slate-900 border border-slate-800 p-2.5 rounded-lg text-xs text-slate-200 outline-none resize-none">${content}</textarea>
                </div>
            `;
        }

        function updateNoteDB(key, field, val) {
            db.ref('notes/' + key + '/' + field).set(val);
        }

        function deleteNoteDB(key) {
            db.ref('notes/' + key).remove();
            document.getElementById('note-editor-container').innerHTML = `<p class="text-xs text-slate-500 italic">Note supprimée.</p>`;
        }

        // --- SESSIONS (LISTEN & WRITE) ---
        function listenSessionsDB() {
            db.ref('sessions').on('value', snapshot => {
                const container = document.getElementById('sessions-list-container');
                if (!container) return;
                const data = snapshot.val();
                if (!data) {
                    container.innerHTML = `<p class="text-xs text-slate-500 italic col-span-2">Aucune session planifiée.</p>`;
                    return;
                }

                container.innerHTML = Object.keys(data).map(key => {
                    const s = data[key];
                    return `
                        <div class="bg-slate-950 border border-slate-800 p-3 rounded-xl flex justify-between items-center">
                            <div>
                                <span class="font-bold text-xs text-white block">${s.title}</span>
                                <span class="text-[10px] text-blue-400 font-mono"><i class="fa-solid fa-clock"></i> ${s.time}</span>
                            </div>
                            <button onclick="deleteSessionDB('${key}')" class="text-red-400 text-xs cursor-pointer"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    `;
                }).join('');
            });
        }

        function addSessionDB(e) {
            e.preventDefault();
            db.ref('sessions').push({
                title: document.getElementById('sess-title').value,
                time: document.getElementById('sess-time').value
            });
        }

        function deleteSessionDB(key) {
            db.ref('sessions/' + key).remove();
        }

        function switchEnaTab(tab) {
            ['unités', 'notes', 'plannings'].forEach(t => {
                const el = document.getElementById(`ena-content-${t}`);
                if (t === tab) el.classList.remove('hidden'); else el.classList.add('hidden');
            });
        }

        // ==========================================
        //  MODULE FONDATION / STAFF (REALTIME DB)
        // ==========================================
        function renderFondationWorkspace() {
            categoryContentContainer.innerHTML = `
                <div class="space-y-4">
                    <h2 class="text-lg font-bold text-white flex items-center gap-2"><i class="fa-solid fa-shield-cat text-purple-400"></i> Fondation - Modération Live</h2>
                    <div id="pending-container" class="space-y-3"></div>
                    <div class="pt-4 border-t border-slate-800">
                        <h3 class="text-xs font-bold text-slate-400 mb-2">Logs système enregistrés en direct :</h3>
                        <div id="logs-container" class="space-y-1 font-mono text-[11px] text-slate-400 max-h-[200px] overflow-y-auto bg-slate-950 p-3 rounded-xl border border-slate-800"></div>
                    </div>
                </div>
            `;
            listenPendingDB();
            listenLogsDB();
        }

        function listenPendingDB() {
            db.ref('pending_requests').on('value', snapshot => {
                const container = document.getElementById('pending-container');
                if (!container) return;
                const data = snapshot.val();
                if (!data) {
                    container.innerHTML = `<p class="text-xs text-slate-500 italic">Aucune demande en attente dans la Realtime DB.</p>`;
                    return;
                }

                container.innerHTML = Object.keys(data).map(key => {
                    const p = data[key];
                    return `
                        <div class="bg-slate-950 border border-slate-800 p-4 rounded-xl flex justify-between items-center">
                            <div>
                                <span class="font-bold text-xs text-white block">${p.email || 'Utilisateur'}</span>
                                <span class="text-[10px] text-amber-400">Demande d'accès pendante</span>
                            </div>
                            <button onclick="validerAccèsDB('${key}', '${p.email}')" class="px-3 py-1.5 bg-emerald-600 text-white rounded text-xs font-bold cursor-pointer">Valider Accès</button>
                        </div>
                    `;
                }).join('');
            });
        }

        function listenLogsDB() {
            db.ref('logs').on('value', snapshot => {
                const container = document.getElementById('logs-container');
                if (!container) return;
                const data = snapshot.val();
                if (!data) {
                    container.innerHTML = `<p class="text-slate-600 italic">Aucun log enregistré.</p>`;
                    return;
                }
                container.innerHTML = Object.values(data).reverse().map(l => `<div>• ${l.action} <span class="text-slate-600">(${l.date})</span></div>`).join('');
            });
        }

        function validerAccèsDB(key, email) {
            db.ref('pending_requests/' + key).remove();
            db.ref('logs').push({
                action: "Validation de l'accès pour " + email,
                date: new Date().toLocaleString('fr-FR')
            });
        }

        // PARAMÈTRES
        document.getElementById('brightness-range').addEventListener('input', (e) => {
            document.documentElement.style.setProperty('--site-brightness', `${e.target.value}%`);
        });
        document.getElementById('open-settings-btn').addEventListener('click', () => settingsDrawer.classList.remove('hidden'));
        document.getElementById('close-settings-btn').addEventListener('click', () => settingsDrawer.classList.add('hidden'));
        document.getElementById('logout-btn').addEventListener('click', () => {
            mainDashboard.classList.add('hidden');
            authScreen.classList.remove('hidden');
        });
    </script>
</body>
</html>
